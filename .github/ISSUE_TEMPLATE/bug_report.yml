name: Bug report
description: Something in gitForge doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search [existing issues](https://github.com/9alvaro0/gitForge/issues?q=is%3Aissue) first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with…
        2. Go to…
        3. Click…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: gitForge version
      description: gitForge → About gitForge
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: git version
      description: Output of `git --version`
      placeholder: "git version 2.50.1 (Apple Git-155)"
  - type: dropdown
    id: hosting
    attributes:
      label: Remote hosting (if relevant)
      options:
        - Not relevant
        - GitHub
        - GitLab.com
        - Self-hosted GitLab
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or additional context
      description: Don't include tokens, private repository URLs or other sensitive data.
